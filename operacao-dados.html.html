<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operação Dados | Forte na Matemática</title>
  <style>
    :root{--navy:#071c38;--blue:#0c5fa8;--cyan:#16c9d4;--orange:#ff8a1f;--white:#f5fbff;--ink:#17304b;--ok:#159b65;--bad:#da4b57}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 5%,#1376b6 0,transparent 28%),linear-gradient(135deg,var(--navy),#0b3e71);display:grid;place-items:center;padding:22px}
    .game{width:min(900px,100%);background:var(--white);border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #020c1c99}.top{padding:25px 30px;background:linear-gradient(110deg,#071c38,#0b599d);color:white;position:relative;overflow:hidden}.top:after{content:'∑  ◉  %  ▥';position:absolute;right:28px;top:15px;font-size:42px;opacity:.16;letter-spacing:10px}.brand{color:var(--cyan);font-size:.78rem;font-weight:bold;text-transform:uppercase;letter-spacing:1.5px}.top h1{font-size:clamp(1.65rem,5vw,2.5rem);margin:6px 0}.top p{margin:0;color:#c9eaff}.hud{display:flex;gap:11px;flex-wrap:wrap;margin-top:18px}.badge{padding:8px 12px;border-radius:999px;background:#ffffff1c;border:1px solid #ffffff38;font-weight:bold;font-size:.9rem}.main{padding:28px}.scene{border-left:6px solid var(--orange);padding:15px 18px;background:#e9f6ff;border-radius:0 13px 13px 0;font-weight:600;line-height:1.5}.challenge{padding:22px 0 10px;font-size:clamp(1.1rem,2.5vw,1.35rem);font-weight:bold;line-height:1.45}.data{background:#fff;border:1px solid #cce2f0;border-radius:16px;padding:16px;overflow:auto;margin:4px 0 20px}.chart{display:flex;align-items:end;gap:13px;min-height:170px;border-bottom:2px solid #aac8dc;padding:10px 6px 0}.barwrap{flex:1;text-align:center;min-width:55px;font-weight:bold;font-size:.82rem}.bar{margin:auto;background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:8px 8px 0 0;min-width:42px;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;color:white}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{border:2px solid #c9e1ee;background:#fff;border-radius:13px;padding:15px;text-align:left;font-size:1rem;font-weight:bold;color:var(--ink);cursor:pointer;transition:.18s}.option:hover{border-color:var(--cyan);transform:translateY(-2px)}.option.correct{border-color:var(--ok);background:#e7f8f0}.option.wrong{border-color:var(--bad);background:#ffeef0}.feedback{min-height:48px;padding:18px 0 2px;font-weight:bold;line-height:1.4}.next{float:right;background:var(--orange);color:#fff;border:0;border-radius:11px;padding:13px 20px;font-size:1rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #bd5c05}.next:active{transform:translateY(4px);box-shadow:0 1px 0 #bd5c05}.next[hidden]{display:none}.intro{text-align:center;padding:26px 12px}.intro h2{font-size:2rem;margin:0 0 10px}.intro p{max-width:620px;margin:0 auto 22px;line-height:1.55}.start{background:var(--orange);color:#fff;border:0;border-radius:13px;padding:16px 25px;font-size:1.1rem;font-weight:bold;cursor:pointer}.result{text-align:center;padding:28px 8px}.result .score{font-size:3.4rem;font-weight:900;color:var(--blue)}.result h2{font-size:2rem;margin:5px}.result p{line-height:1.5}.restart{background:var(--blue);color:white;border:0;border-radius:12px;padding:14px 20px;font-weight:bold;font-size:1rem;cursor:pointer}@media(max-width:560px){.main{padding:19px}.top{padding:22px}.options{grid-template-columns:1fr}.top:after{display:none}}
  </style>
</head>
<body>
  <main class="game">
    <section class="top"><div class="brand">Forte na Matemática</div><h1>OPERAÇÃO DADOS</h1><p>Prefeito, use a Estatística para tomar boas decisões.</p><div class="hud" id="hud" hidden><span class="badge" id="phase"></span><span class="badge">⭐ Pontos: <span id="points">0</span></span></div></section>
    <section class="main" id="screen"></section>
  </main>
<script>
const missions=[
 {scene:'Decisão 1 — Hospital Municipal',text:'Com base nos atendimentos dos 5 dias anteriores (18, 22, 20, 24 e 16 pacientes), calcule a média diária. Esse dado servirá para definir a escala da equipe na próxima semana.',options:['18','20','21','22'],answer:1,why:'18 + 22 + 20 + 24 + 16 = 100; 100 ÷ 5 = 20 pacientes por dia.'},
 {scene:'Decisão 2 — Semáforos',text:'Com base nos tempos de espera registrados na semana anterior (4, 2, 7, 5 e 3 minutos), calcule a mediana. Esse valor ajudará a avaliar o tempo típico antes de ajustar o sinal.',options:['3','4','5','7'],answer:1,why:'Em ordem: 2, 3, 4, 5, 7. O valor central é 4.'},
 {scene:'Decisão 3 — Transporte Escolar',text:'Com base na pesquisa feita no último mês — ônibus 14, carro 8, bicicleta 5 e a pé 3 — determine a moda. Esse dado orientará a prioridade do próximo investimento em transporte.',options:['Carro','Bicicleta','Ônibus','A pé'],answer:2,why:'A moda é a categoria mais frequente: ônibus, com 14 respostas.'},
 {scene:'Decisão 4 — Distribuição de Água',text:'Com base no gráfico da semana anterior, calcule o total de garrafas distribuídas. Esse total será usado para planejar o estoque da próxima semana.',chart:[['Seg',12],['Ter',18],['Qua',15],['Qui',20]],options:['45','50','60','65'],answer:3,why:'12 + 18 + 15 + 20 = 65 garrafas.'},
 {scene:'Decisão 5 — Defesa Civil',text:'Com base nas temperaturas da última semana (21 °C, 25 °C, 23 °C, 28 °C e 20 °C), calcule a amplitude. Esse dado ajudará a preparar as próximas ações da Defesa Civil.',options:['5 °C','8 °C','20 °C','28 °C'],answer:1,why:'Amplitude = maior valor − menor valor: 28 − 20 = 8 °C.'},
 {scene:'Decisão 6 — Coleta de Lixo',text:'Com base na produção de lixo dos quatro bairros no mês anterior (30, 38, 32 e 40 toneladas), calcule a média por bairro. Esse valor será a referência para organizar a coleta do próximo mês.',options:['34','35','36','37'],answer:1,why:'30 + 38 + 32 + 40 = 140; 140 ÷ 4 = 35 toneladas.'},
 {scene:'Decisão 7 — Atendimento da Prefeitura',text:'Com base nas avaliações dadas pelos moradores no trimestre anterior (9, 7, 8, 9, 6, 9 e 8), determine a moda. Esse dado orientará a meta de qualidade para o próximo trimestre.',options:['6','7','8','9'],answer:3,why:'A nota 9 aparece 3 vezes, mais do que qualquer outra.'},
 {scene:'Decisão 8 — Merenda Escolar',text:'Com base no desperdício de refeições da semana anterior nas cinco escolas (11, 14, 9, 16 e 10), calcule a mediana. Esse valor servirá de referência para as ações da próxima semana.',options:['10','11','12','14'],answer:1,why:'Em ordem: 9, 10, 11, 14, 16. A mediana é 11.'},
 {scene:'Decisão 9 — Iluminação Pública',text:'Com base no gráfico do mês anterior, identifique qual equipe teve o maior número de lâmpadas trocadas. Esse dado definirá qual método será replicado nas próximas ações.',chart:[['Norte',24],['Sul',17],['Leste',29],['Oeste',21]],options:['Norte','Sul','Leste','Oeste'],answer:2,why:'A equipe Leste realizou 29 trocas, o maior valor do gráfico.'},
 {scene:'Decisão 10 — Orçamento Participativo',text:'Com base na consulta do ano anterior, 70 dos 200 moradores escolheram saúde como prioridade. Calcule a porcentagem. Esse dado ajudará a definir a proposta do próximo orçamento.',options:['25%','30%','35%','70%'],answer:2,why:'70 ÷ 200 = 0,35; portanto, 35% dos moradores.'}
];
let current=0,points=0,locked=false;
const screen=document.querySelector('#screen'),hud=document.querySelector('#hud');
function intro(){hud.hidden=true;screen.innerHTML=`<div class="intro"><h2>🏛️ Prefeito, a cidade precisa de você!</h2><p>Use os dados do dia, mês, semana ou ano anterior para calcular indicadores estatísticos e planejar as próximas atitudes da cidade. Você começa com <strong>500 pontos</strong>: cada erro tira 50 pontos, mas a decisão só termina quando você acertar.</p><button class="start" onclick="start()">COMEÇAR GESTÃO</button></div>`}
function start(){current=0;points=500;hud.hidden=false;render();}
function graph(items){const max=Math.max(...items.map(x=>x[1]));return `<div class="data"><div class="chart">${items.map(([n,v])=>`<div class="barwrap"><div class="bar" style="height:${40+v/max*90}px">${v}</div><p>${n}</p></div>`).join('')}</div></div>`}
function render(){locked=false;const m=missions[current];document.querySelector('#phase').textContent=`DECISÃO ${current+1}/${missions.length}`;document.querySelector('#points').textContent=points;screen.innerHTML=`<div class="scene">${m.scene}</div><div class="challenge">${m.text}</div>${m.chart?graph(m.chart):''}<div class="options">${m.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="next" id="next" hidden onclick="advance()">PRÓXIMA DECISÃO →</button>`}
function answer(i){if(locked)return;const m=missions[current],buttons=[...document.querySelectorAll('.option')],ok=i===m.answer;if(!ok){points=Math.max(0,points-50);document.querySelector('#points').textContent=points;buttons[i].classList.add('wrong');buttons[i].disabled=true;document.querySelector('#feedback').innerHTML=`⚠️ Resposta incorreta. Você perdeu 50 pontos. Essa alternativa foi bloqueada; tente outra!`;return;}locked=true;points+=100;document.querySelector('#points').textContent=points;buttons[i].classList.add('correct');buttons.forEach(b=>b.disabled=true);document.querySelector('#feedback').innerHTML=`✅ Missão cumprida! +100 pontos. ${m.why}`;document.querySelector('#next').hidden=false;}
function advance(){current++;if(current>=missions.length)finish(true);else render()}
function finish(win){hud.hidden=true;screen.innerHTML=`<div class="result"><div class="score">${points}</div><h2>${win?'🏆 Gestão concluída, prefeito!':'🛰️ Operação interrompida'}</h2><p>${win?'Você tomou as 10 decisões da cidade e mostrou que sabe usar média, mediana, moda, gráficos, amplitude e porcentagem.':'Revise as explicações e tente novamente.'}</p><button class="restart" onclick="start()">JOGAR NOVAMENTE</button></div>`}
intro();
</script>
</body></html>
